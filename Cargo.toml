[package]
name = "kako-helpers"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.20"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
